import re, requests
from urllib.parse import urljoin
from bs4 import BeautifulSoup
from email.utils import format_datetime
from datetime import datetime, timezone, timedelta
from xml.sax.saxutils import escape

URL = "https://www.headline4hk.com/latest-news"
HKT = timezone(timedelta(hours=8))
html = requests.get(URL, headers={"User-Agent": "Mozilla/5.0"}, timeout=20).text
soup = BeautifulSoup(html, "html.parser")

items, seen = [], set()
for tr in soup.select("tr"):
    a = next((x for x in tr.find_all("a", href=True)
              if "/article/" in x["href"] and x.get_text(strip=True)), None)
    if not a: continue
    link = urljoin(URL, a["href"])
    if link in seen: continue
    seen.add(link)
    tds = [td.get_text(" ", strip=True) for td in tr.find_all("td")]
    m = re.search(r"(\d\d)-(\d\d)\s+(\d\d):(\d\d)", tds[0] if tds else "")
    now = datetime.now(HKT)
    dt = datetime(now.year, *map(int, m.groups()), tzinfo=HKT) if m else now
    items.append((a.get_text(strip=True), link, tds[3] if len(tds) > 3 else "", dt))

rss = ['<?xml version="1.0" encoding="UTF-8"?><rss version="2.0"><channel>',
       '<title>Headline4HK 即時新聞（個人用）</title>',
       '<link>https://www.headline4hk.com</link><description>unofficial</description>']
for t, l, s, d in items:
    rss.append(f"<item><title>[{escape(s)}] {escape(t)}</title><link>{escape(l)}</link>"
               f"<guid>{escape(l)}</guid><pubDate>{format_datetime(d)}</pubDate></item>")
rss.append("</channel></rss>")
import os
os.makedirs("public", exist_ok=True)
open("public/feed.xml", "w", encoding="utf-8").write("".join(rss))
